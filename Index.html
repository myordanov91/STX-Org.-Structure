<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organisation Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#1D7B7F; --pine-d:#155e69; --pine-l:#e7f2f4;
    --royal:#1360A0; --navy:#031C2B; --mint:#B0F7CF; --coral:#E66D62;
    --ink:#1B2733; --muted:#5A6B7B; --line:#b9cace; --bg:#f4f6f7; --card:#ffffff;
    --grey:#E6E6DC; --pink:#FBEBEC; --chip:#eef3f4;
    --shadow:0 1px 2px rgba(3,28,43,.06),0 6px 18px rgba(3,28,43,.06);
    --radius:10px; --conn:2px;
    /* location accents */
    --loc-bg:#1D7B7F; --loc-ie:#1360A0; --loc-us:#E66D62; --loc-ro:#7a5cc0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Poppins',Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);
       -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.4}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{margin:0;font-weight:600;color:var(--navy)}

  /* Header */
  header.stx-top{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  header.stx-top .stx-title h1{font-size:16px}
  header.stx-top .stx-title .sub{font-size:11.5px;color:var(--muted)}
  header.stx-top img.stx-logo{height:26px;width:auto;display:block}

  /* Toolbar */
  .stx-toolbar{position:sticky;top:57px;z-index:35;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .stx-tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .stx-tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 14px;
    font-size:12.5px;font-weight:500;cursor:pointer;transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .stx-tab .n{font-size:10.5px;opacity:.7}
  .stx-tab:hover{border-color:var(--pine);color:var(--pine)}
  .stx-tab.active{background:var(--pine);border-color:var(--pine);color:#fff}
  .stx-tab.dyn{border-style:dashed}
  .stx-tab .x{margin-left:2px;font-size:13px;opacity:.8}
  .stx-tab .x:hover{opacity:1}
  .stx-spacer{flex:1 1 auto}
  .stx-search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:170px}
  .stx-search input{border:0;outline:0;font-family:inherit;font-size:13px;width:100%;background:transparent;color:var(--ink)}
  .stx-zoom{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .stx-zoom .stx-btn{border:0;border-radius:0;border-right:1px solid var(--line)}
  .stx-zoom .stx-btn:last-child{border-right:0}
  .stx-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-family:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .stx-btn:hover{color:var(--pine);border-color:var(--pine)}

  /* Location filter */
  .stx-filter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px}
  .stx-filter .flbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
  .loc-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:.12s;user-select:none;white-space:nowrap}
  .loc-toggle .dot{width:9px;height:9px;border-radius:50%;background:var(--dotc,var(--muted));flex:none}
  .loc-toggle .cnt{font-size:10.5px;opacity:.7}
  .loc-toggle.on{color:#fff;border-color:transparent;background:var(--dotc,var(--pine))}
  .loc-toggle.on .dot{background:#fff}
  .loc-toggle.off{opacity:.55;background:#fff}
  .loc-toggle.off .dot{opacity:.5}

  /* Breadcrumb */
  .stx-crumbs{padding:12px 26px 0;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .stx-crumbs a{color:var(--pine-d);cursor:pointer}
  .stx-crumbs a:hover{text-decoration:underline}
  .stx-crumbs .sep{opacity:.5}
  .stx-crumbs .cur{color:var(--navy);font-weight:600}

  /* Canvas */
  .stx-canvas{padding:22px 26px 60px;overflow-x:auto}

  /* Stats strip */
  .stx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:0 auto 26px;max-width:820px}
  .stx-stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;position:relative;overflow:hidden}
  .stx-stat .num{font-size:23px;font-weight:700;color:var(--pine-d);line-height:1}
  .stx-stat .lbl{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
  .stx-stat .lbl .dot{width:8px;height:8px;border-radius:50%}
  .stx-stat.off{opacity:.4}

  /* Fan (apex + connected wrapping card grid) */
  .stx-fan{display:flex;flex-direction:column;align-items:center;transform-origin:top center}
  .stx-apex{background:var(--pine);color:#fff;border-radius:var(--radius);padding:12px 22px;min-width:230px;max-width:420px;text-align:center;box-shadow:var(--shadow)}
  .stx-apex .role{font-weight:600;font-size:15px;line-height:1.25}
  .stx-apex .meta{font-size:11.5px;opacity:.92;margin-top:3px}
  .stx-apex .ctx{font-size:11px;opacity:.85;margin-top:2px}
  .fan-drop{width:var(--conn);height:22px;background:var(--line)}
  .stx-fan-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;
    border-top:var(--conn) solid var(--line);padding-top:24px;position:relative;max-width:100%}
  .stx-fan-grid.single{border-top:0;padding-top:0}
  .stx-fan-grid>.item{position:relative}
  .stx-fan-grid:not(.single)>.item::before{content:'';position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:var(--conn);height:24px;background:var(--line)}

  /* Nav cards */
  .stx-navcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--pine);border-radius:var(--radius);
    padding:13px 15px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;text-align:left;width:186px;min-height:104px;
    display:flex;flex-direction:column}
  .stx-navcard:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(3,28,43,.14);border-color:var(--pine)}
  .stx-navcard .ttl{font-weight:600;font-size:13.5px;color:var(--pine-d);line-height:1.25}
  .stx-navcard .ctx{font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.3px}
  .stx-navcard .cnt{font-size:12px;color:var(--ink);margin-top:8px}
  .stx-navcard .open{color:var(--pine);font-weight:600;font-size:12px;margin-top:auto;padding-top:8px}

  /* Role unit boxes (team view) */
  .stx-unit{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);text-align:left;width:252px}
  .stx-unit-h{background:var(--pine-l);border-bottom:1px solid var(--line);padding:9px 12px;color:var(--pine-d)}
  .stx-unit-h .rt{font-weight:600;font-size:12.5px;line-height:1.25;display:flex;align-items:flex-start;gap:6px;justify-content:space-between}
  .stx-unit-h a.rt-link{color:var(--pine-d);border-bottom:1.5px solid var(--pine)}
  .stx-unit-h .rt-meta{margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .stx-emp{padding:7px 12px;border-top:1px solid #eef1f2;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .stx-emp:first-child{border-top:0}
  .stx-emp .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
  .stx-emp .er{display:inline-flex;align-items:center;gap:6px;flex:none}
  .stx-emp .co{font-size:9.5px;color:var(--coral);border:1px solid var(--coral);border-radius:5px;padding:0 5px;font-weight:600;white-space:nowrap}

  /* Chips */
  .stx-chip{background:var(--chip);color:var(--muted);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .loc-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .loc-chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .stx-ext{display:inline-block;width:11px;height:11px;margin-left:2px;vertical-align:-1px;opacity:.7;flex:none}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px;max-width:420px}

  footer.stx-foot{padding:14px 26px 40px;color:var(--muted);font-size:11px;text-align:center}

  .dim{opacity:.22}
  .hit{outline:2px solid var(--coral);outline-offset:-2px;border-radius:8px}

  @media (max-width:520px){
    .stx-navcard{width:150px}
    .stx-unit{width:100%;max-width:320px}
  }
</style>
</head>

  <div class="stx-tabs" id="tabs"></div>
  <span class="stx-spacer"></span>

    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5A6B7B" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

lnitzky","loc":"Romania","company":"Taxback"}]}],"n":1}],"n":4},{"name":"Administration","teams":[{"name":"TB Office Support","dept":"TB Office Support","roles":[{"title":"Office Manager","level":"","jd":"","employees":[{"name":"Lucian Ionescu","loc":"Romania","company":"Taxback"}]}],"n":1}],"n":1},{"name":"HR","teams":[{"name":"Employee Experience","dept":"STX Support","roles":[{"title":"Employee Experience Specialist","level":"IC2","jd":"","employees":[{"name":"Marian Yordanov","loc":"Bulgaria","company":"Sprintax"}]}],"n":1}],"n":1}],"total":169};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Location accents */
const LOCMETA={
  'Bulgaria':{v:'--loc-bg',c:'#1D7B7F'},
  'Ireland' :{v:'--loc-ie',c:'#1360A0'},
  'US'      :{v:'--loc-us',c:'#E66D62'},
  'Romania' :{v:'--loc-ro',c:'#7a5cc0'}
};
const ACTIVE=new Set(DATA.locations);

/* ---- filtered counts ---- */
const inLoc=e=>ACTIVE.has(e.loc);
const roleVis=r=>r.employees.filter(inLoc);
const teamVis=t=>t.roles.reduce((n,r)=>n+roleVis(r).length,0);
const funcVis=f=>f.teams.reduce((n,t)=>n+teamVis(t),0);
const totalVis=()=>DATA.functions.reduce((n,f)=>n+funcVis(f),0);
const locCount=loc=>DATA.functions.reduce((n,f)=>n+f.teams.reduce((m,t)=>m+t.roles.reduce((k,r)=>k+r.employees.filter(e=>e.loc===loc).length,0),0),0);
const findFn=name=>DATA.functions.find(f=>f.name===name);

/* ---- view state ---- */
let VIEW={type:'company'};

/* ---- external link glyph ---- */
const EXT='<svg class="stx-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M14 5h5v5"/><path d="M19 5l-9 9"/><path d="M19 13v6H5V5h6"/></svg>';

/* ---- location filter chips ---- */
function renderFilter(){
  const wrap=document.getElementById('filter');
  wrap.querySelectorAll('.loc-toggle').forEach(n=>n.remove());
  DATA.locations.forEach(loc=>{
    const on=ACTIVE.has(loc), m=LOCMETA[loc];
    const b=document.createElement('button');
    b.className='loc-toggle '+(on?'on':'off');
    b.style.setProperty('--dotc',m.c);
    b.innerHTML='<span class="dot"></span>'+esc(loc)+' <span class="cnt">'+locCount(loc)+'</span>';
    b.onclick=()=>{ if(ACTIVE.has(loc)) ACTIVE.delete(loc); else ACTIVE.add(loc); if(ACTIVE.size===0) ACTIVE.add(loc); render(); };
    wrap.appendChild(b);
  });
}

/* ---- tabs (functions + dynamic team tab) ---- */
function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  const home=document.createElement('button');
  home.className='stx-tab'+(VIEW.type==='company'?' active':'');
  home.textContent='Company';
  home.onclick=()=>{VIEW={type:'company'};render();};
  t.appendChild(home);

  DATA.functions.forEach(f=>{
    if(funcVis(f)===0) return;
    const b=document.createElement('button');
    const act=(VIEW.type==='function'&&VIEW.fn===f.name)||(VIEW.type==='team'&&VIEW.fn===f.name);
    b.className='stx-tab'+(act?' active':'');
    b.innerHTML=esc(f.name)+' <span class="n">'+funcVis(f)+'</span>';
    b.onclick=()=>{VIEW={type:'function',fn:f.name};render();};
    t.appendChild(b);
  });

  if(VIEW.type==='team'){
    const fn=findFn(VIEW.fn); const team=fn&&fn.teams[VIEW.ti];
    if(team){
      const b=document.createElement('button');
      b.className='stx-tab dyn active';
      b.innerHTML=esc(team.name)+' <span class="x" title="Close">✕</span>';
      b.onclick=(ev)=>{ if(ev.target.classList.contains('x')){VIEW={type:'function',fn:VIEW.fn};} render(); };
      t.appendChild(b);
    }
  }
}

/* ---- breadcrumb ---- */
function renderCrumbs(){
  const c=document.getElementById('crumbs'); c.innerHTML='';
  const add=(label,fn,cur)=>{
    if(cur){const s=document.createElement('span');s.className='cur';s.textContent=label;c.appendChild(s);}
    else{const a=document.createElement('a');a.textContent=label;a.onclick=fn;c.appendChild(a);}
  };
  const sep=()=>{const s=document.createElement('span');s.className='sep';s.textContent='›';c.appendChild(s);};
  add('Company',()=>{VIEW={type:'company'};render();},VIEW.type==='company');
  if(VIEW.type==='function'||VIEW.type==='team'){sep();add(VIEW.fn,()=>{VIEW={type:'function',fn:VIEW.fn};render();},VIEW.type==='function');}
  if(VIEW.type==='team'){const fn=findFn(VIEW.fn);const team=fn&&fn.teams[VIEW.ti];sep();add(team?team.name:'',null,true);}
}

/* ---- fan builder ---- */
function fan(apexHTML, itemsHTML){
  const single=itemsHTML.length<=1;
  return '<div class="stx-fan"><div class="stx-apex">'+apexHTML+'</div>'+
    (itemsHTML.length?'<div class="fan-drop"></div><div class="stx-fan-grid'+(single?' single':'')+'">'+
      itemsHTML.map(h=>'<div class="item">'+h+'</div>').join('')+'</div>':'')+
    '</div>';
}

/* ---- views ---- */
function viewCompany(){
  const c=DATA.ceo;
  const stats=['<div class="stx-stat"><div class="num">'+totalVis()+'</div><div class="lbl">Total employees</div></div>']
    .concat(DATA.locations.map(loc=>{
      const on=ACTIVE.has(loc),m=LOCMETA[loc];
      return '<div class="stx-stat'+(on?'':' off')+'"><div class="num">'+locCount(loc)+'</div>'+
        '<div class="lbl"><span class="dot" style="background:'+m.c+'"></span>'+esc(loc)+'</div></div>';
    })).join('');
  const cards=DATA.functions.filter(f=>funcVis(f)>0).map(f=>{
    const nT=f.teams.filter(t=>teamVis(t)>0).length;
    return '<div class="stx-navcard" data-search="'+esc(f.name.toLowerCase())+'" onclick="go(\''+esc(f.name)+'\')">'+
      '<div class="ttl">'+esc(f.name)+'</div>'+
      '<div class="cnt"><b>'+funcVis(f)+'</b> people · '+nT+' team'+(nT===1?'':'s')+'</div>'+
      '<div class="open">Open ↗</div></div>';
  });
  const apex='<div class="role">'+esc(c.name)+'</div><div class="meta">'+esc(c.title)+'</div>'+
    '<div class="ctx">'+esc(DATA.company)+'</div>';
  return '<div class="stx-stats">'+stats+'</div>'+fan(apex,cards);
}

function viewFunction(fn){
  const cards=fn.teams.map((t,i)=>({t,i})).filter(o=>teamVis(o.t)>0).map(({t,i})=>{
    return '<div class="stx-navcard" data-search="'+esc((t.name+' '+t.dept).toLowerCase())+'" onclick="goTeam(\''+esc(fn.name)+'\','+i+')">'+
      '<div class="ttl">'+esc(t.name)+'</div>'+
      '<div class="ctx">'+esc(t.dept)+'</div>'+
      '<div class="cnt"><b>'+teamVis(t)+'</b> '+(teamVis(t)===1?'person':'people')+' · '+(rc=>rc+' role'+(rc===1?'':'s'))(t.roles.filter(r=>roleVis(r).length).length)+'</div>'+
      '<div class="open">Open ↗</div></div>';
  });
  const apex='<div class="role">'+esc(fn.name)+'</div><div class="meta">'+funcVis(fn)+' people · '+cards.length+' teams</div>';
  return fan(apex,cards);
}

function viewTeam(fn,team){
  const boxes=team.roles.map(r=>{
    const emps=roleVis(r); if(!emps.length) return null;
    const title = r.jd
      ? '<a class="rt-link" href="'+esc(r.jd)+'" target="_blank" rel="noopener">'+esc(r.title)+EXT+'</a>'
      : esc(r.title);
    const meta='<div class="rt-meta">'+(r.level?'<span class="stx-chip">'+esc(r.level)+'</span>':'')+
      '<span class="loc-chip" style="color:var(--muted)">'+emps.length+' '+(emps.length===1?'person':'people')+'</span></div>';
    const rows=emps.map(e=>{
      const m=LOCMETA[e.loc]||{c:'#5A6B7B'};
      const co=(e.company&&e.company!=='Sprintax')?'<span class="co">'+esc(e.company)+'</span>':'';
      return '<div class="stx-emp" data-search="'+esc((e.name+' '+r.title+' '+team.name+' '+e.loc).toLowerCase())+'">'+
        '<span class="nm">'+esc(e.name)+'</span>'+
        '<span class="er">'+co+'<span class="loc-chip"><span class="dot" style="background:'+m.c+'"></span>'+esc(e.loc)+'</span></span></div>';
    }).join('');
    return '<div class="stx-unit" data-search="'+esc((r.title+' '+team.name).toLowerCase())+'">'+
      '<div class="stx-unit-h"><div class="rt">'+title+'</div>'+meta+'</div>'+rows+'</div>';
  }).filter(Boolean);
  const apex='<div class="role">'+esc(team.name)+'</div><div class="ctx">'+esc(team.dept)+' · '+esc(fn.name)+'</div>'+
    '<div class="meta">'+teamVis(team)+' '+(teamVis(team)===1?'person':'people')+'</div>';
  if(!boxes.length) return fan(apex,[])+'<div class="empty" style="margin:20px auto 0">No employees in this team at the selected locations. Adjust the location filter above.</div>';
  return fan(apex,boxes);
}

/* ---- navigation handlers ---- */
window.go=name=>{VIEW={type:'function',fn:name};render();};
window.goTeam=(name,i)=>{VIEW={type:'team',fn:name,ti:i};render();};

/* ---- zoom / fit ---- */
let ZOOM=1;
function applyZoom(){const el=document.querySelector('.stx-fan');if(el)el.style.zoom=ZOOM;}
function autoFit(){
  const c=document.getElementById('canvas'), el=document.querySelector('.stx-fan'); if(!el){return;}
  el.style.zoom=1; const nw=el.scrollWidth; const avail=c.clientWidth-4;
  ZOOM = nw>avail ? Math.max(0.4, avail/nw) : 1;
  el.style.zoom=ZOOM;
}
document.getElementById('zIn').onclick =()=>{ZOOM=Math.min(1.4,ZOOM+0.1);applyZoom();};
document.getElementById('zOut').onclick=()=>{ZOOM=Math.max(0.35,ZOOM-0.1);applyZoom();};
document.getElementById('zFit').onclick=autoFit;
window.addEventListener('resize',()=>{clearTimeout(window._z);window._z=setTimeout(autoFit,150);});

/* ---- search ---- */
function applySearch(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  document.querySelectorAll('[data-search]').forEach(el=>{
    const hit=!q||(el.dataset.search||'').includes(q);
    el.classList.toggle('hit',!!q&&hit); el.classList.toggle('dim',!!q&&!hit);
  });
}
document.getElementById('q').addEventListener('input',applySearch);

/* ---- master render ---- */
function render(){
  renderFilter(); renderTabs(); renderCrumbs();
  const canvas=document.getElementById('canvas');
  let html='';
  if(VIEW.type==='company') html=viewCompany();
  else if(VIEW.type==='function'){const fn=findFn(VIEW.fn); html=fn?viewFunction(fn):viewCompany();}
  else if(VIEW.type==='team'){const fn=findFn(VIEW.fn); const team=fn&&fn.teams[VIEW.ti]; html=team?viewTeam(fn,team):(fn?viewFunction(fn):viewCompany());}
  canvas.innerHTML=html;
  autoFit(); applySearch();
}
render();
</script>
