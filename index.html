<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprintax — Organisation Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#1E7F8E; --teal-d:#155e69; --teal-l:#e7f2f4;
    --navy:#1B2733; --muted:#5A6B7B; --coral:#E66D62;
    --line:#c9d6da; --bg:#f4f6f7; --card:#ffffff; --chip:#eef3f4;
    --shadow:0 1px 2px rgba(27,39,51,.06),0 6px 18px rgba(27,39,51,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Poppins',Arial,Helvetica,sans-serif;color:var(--navy);background:var(--bg);
       -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.35}
  a{color:inherit;text-decoration:none}

  /* ---------- Header ---------- */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .brandwrap{display:flex;flex-direction:column;gap:2px}
  .brandwrap h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
  .brandwrap .sub{font-size:11.5px;color:var(--muted);font-weight:400}
  header.top img.logo{height:26px;width:auto;display:block}

  /* ---------- Toolbar ---------- */
  .toolbar{position:sticky;top:57px;z-index:35;background:var(--bg);
    border-bottom:1px solid var(--line);padding:10px 18px;display:flex;flex-wrap:wrap;
    gap:10px 14px;align-items:center}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;
    padding:6px 14px;font-size:12.5px;font-weight:500;cursor:pointer;transition:background .12s,color .12s,border-color .12s;white-space:nowrap}
  .tab .n{font-size:10.5px;opacity:.7;margin-left:5px}
  .tab:hover{border-color:var(--teal);color:var(--teal)}
  .tab.active{background:var(--teal);border-color:var(--teal);color:#fff}
  .tab.active .n{opacity:.85}
  .spacer{flex:1 1 auto}
  .search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;min-width:210px}
  .search svg{flex:none}
  .search input{border:0;outline:0;font-family:inherit;font-size:13px;width:100%;color:var(--navy);background:transparent}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    cursor:pointer;user-select:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px}
  .toggle input{accent-color:var(--teal);width:15px;height:15px;cursor:pointer}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-family:inherit;
    font-size:12.5px;color:var(--muted);cursor:pointer}
  .btn:hover{border-color:var(--teal);color:var(--teal)}

  /* ---------- Canvas ---------- */
  .canvas{padding:26px 26px 60px;overflow-x:auto}
  .fnhead{display:flex;flex-direction:column;align-items:center;gap:0}
  .apex{background:var(--teal);color:#fff;border-radius:10px;padding:12px 22px;min-width:240px;max-width:340px;
    text-align:center;box-shadow:var(--shadow)}
  .apex .role{font-weight:600;font-size:14.5px;line-height:1.25}
  .apex .meta{font-size:11px;opacity:.9;margin-top:3px;font-weight:400}
  .apex a.role-link{color:#fff;border-bottom:1px solid rgba(255,255,255,.55)}
  .apex a.role-link:hover{border-bottom-color:#fff}

  .drop{width:2px;height:22px;background:var(--line)}
  .rail{height:2px;background:var(--line);border-radius:2px}

  /* departments row */
  .depts{display:flex;gap:26px;align-items:flex-start;justify-content:flex-start;padding-top:2px}
  .dept{display:flex;flex-direction:column;gap:12px;min-width:210px;max-width:250px}
  .dept-h{background:var(--teal-d);color:#fff;border-radius:9px;padding:9px 12px;text-align:center;
    font-weight:600;font-size:13px;box-shadow:var(--shadow)}
  .units{display:flex;flex-direction:column;gap:16px}

  .unit{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  .unit-h{background:var(--teal-l);border-bottom:1px solid var(--line);padding:8px 11px}
  .unit-h .u{font-weight:600;font-size:12.5px;color:var(--teal-d)}
  .unit-h a.cf{color:var(--teal-d);border-bottom:1.5px solid var(--teal)}
  .unit-h a.cf:hover{color:var(--teal);background:rgba(30,127,142,.06)}
  .unit-h .cfhint{display:block;font-size:9.5px;color:var(--muted);font-weight:400;margin-top:1px;
    text-transform:none;letter-spacing:.2px}
  .roles{display:flex;flex-direction:column}
  .role-card{padding:8px 11px;border-top:1px solid #eef1f2}
  .role-card:first-child{border-top:0}
  .role-card .rt{font-size:12px;font-weight:500;line-height:1.25;color:var(--navy)}
  .role-card a.jd{color:var(--teal-d);border-bottom:1.5px solid var(--teal);cursor:pointer}
  .role-card a.jd:hover{color:var(--teal);background:rgba(30,127,142,.06)}
  .rmeta{display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap}
  .chip{background:var(--chip);color:var(--muted);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:600;letter-spacing:.3px}
  .sal{font-size:10.5px;color:var(--muted)}
  .flag{font-size:9.5px;color:var(--coral);border:1px solid var(--coral);border-radius:5px;padding:0 5px;font-weight:600}
  .ext{display:inline-block;width:9px;height:9px;margin-left:3px;vertical-align:baseline;opacity:.6}

  /* company overview */
  .cofns{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding-top:2px}
  .cofn{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:10px;
    padding:14px 16px;min-width:190px;max-width:220px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s}
  .cofn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(27,39,51,.12)}
  .cofn .fn{font-weight:600;font-size:14px;color:var(--teal-d)}
  .cofn .hd{font-size:12px;color:var(--navy);margin-top:6px;font-weight:500}
  .cofn .hd small{display:block;color:var(--muted);font-weight:400;font-size:10.5px;margin-top:1px}
  .cofn .cnt{font-size:10.5px;color:var(--muted);margin-top:9px}

  .note{max-width:760px;margin:0 auto 18px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);
    border-radius:8px;padding:11px 14px;font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);font-size:12px;padding:6px 2px}

  /* search states */
  .role-card.dim,.unit.dim{opacity:.28}
  .role-card.hit{background:rgba(230,109,98,.10);outline:2px solid var(--coral);outline-offset:-2px;border-radius:6px}

  /* footer */
  footer{padding:14px 26px 40px;color:var(--muted);font-size:11px;text-align:center}
  .legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:3px;display:inline-block}

  @media print{
    .toolbar,header.top .actions{display:none!important}
    .canvas{overflow:visible}
    body{background:#fff}
  }
</style>
</head>

const EXT = '<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M9 7h8v8"/></svg>';
let SHOW_SAL = true;
let CURRENT = 'company';

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function roleTitleHTML(r){
  const t = esc(r.title);
  if(r.jd) return `<a class="jd" href="${esc(r.jd)}" target="_blank" rel="noopener" title="Open job description">${t}${EXT}</a>`;
  return t;
}
function salHTML(r){
  if(!SHOW_SAL || !r.salary) return '';
  return `<span class="sal">${esc(r.salary)}</span>`;
}
function roleCard(r){
  const chip = r.level ? `<span class="chip">${esc(r.level)}</span>` : '';
  const flag = (r.company && r.company!=='Sprintax') ? `<span class="flag">${esc(r.company)}</span>` : '';
  return `<div class="role-card" data-title="${esc((r.title||'').toLowerCase())}">
      <div class="rt">${roleTitleHTML(r)}</div>
      <div class="rmeta">${chip}${salHTML(r)}${flag}</div>
    </div>`;
}
function unitBlock(u){
  let head;
  if(u.cf){
    head = `<a class="cf" href="${esc(u.cf)}" target="_blank" rel="noopener" title="Open career framework">${esc(u.unit)}${EXT}</a>
            <span class="cfhint">Career framework ↗</span>`;
  } else {
    head = `<span>${esc(u.unit)}</span>`;
  }
  return `<div class="unit">
      <div class="unit-h"><div class="u">${head}</div></div>
      <div class="roles">${u.roles.map(roleCard).join('')}</div>
    </div>`;
}
function deptCol(d){
  return `<div class="dept">
      <div class="dept-h">${esc(d.dept)}</div>
      <div class="units">${d.units.map(unitBlock).join('')}</div>
    </div>`;
}

function renderCompany(){
  const c = DATA.ceo;
  const apex = `<div class="apex">
      <div class="role">${c.jd?`<a class="role-link" href="${esc(c.jd)}" target="_blank" rel="noopener">${esc(c.title)}</a>`:esc(c.title)}</div>
      <div class="meta">Chief Executive Officer</div>
    </div>`;
  const cards = DATA.functions.filter(f=>f.head||f.count).map(f=>{
    const h=f.head;
    const hd = h ? `<div class="hd">${esc(h.title)}<small>${esc(h.level||'')} ${h.level&&h.salary&&SHOW_SAL?'· '+esc(h.salary):''}</small></div>` : `<div class="hd" style="color:var(--muted)">—</div>`;
    return `<div class="cofn" data-fn="${esc(f.function)}">
        <div class="fn">${esc(f.function)}</div>${hd}
        <div class="cnt">${f.count} role${f.count===1?'':'s'} · ${f.departments.length} area${f.departments.length===1?'':'s'}</div>
      </div>`;
  }).join('');
  return `<div class="fnhead">${apex}<div class="drop"></div>
      <div class="rail" style="width:min(1000px,90%)"></div><div class="drop"></div></div>
      <div class="cofns">${cards}</div>`;
}

function renderFunction(f){
  let head='';
  if(f.head){
    const h=f.head;
    head = `<div class="fnhead">
        <div class="apex">
          <div class="role">${h.jd?`<a class="role-link" href="${esc(h.jd)}" target="_blank" rel="noopener">${esc(h.title)}</a>`:esc(h.title)}</div>
          <div class="meta">${esc(h.level||'')} ${(h.level&&h.salary&&SHOW_SAL)?'· '+esc(h.salary):''}</div>
        </div>
        <div class="drop"></div><div class="rail" style="width:min(1100px,92%)"></div><div class="drop"></div>
      </div>`;
  }
  let note='';
  if(f.function==='Commercial'||f.function==='Marketing'||f.function==='Finance'){
    note = `<div class="note">Reporting lines and levels for ${esc(f.function)} are still being finalised in the source workbook, so roles here are grouped by area rather than by manager.</div>`;
  }
  const body = f.departments.length
    ? `<div class="depts">${f.departments.map(deptCol).join('')}</div>`
    : `<div class="empty">No roles recorded.</div>`;
  return head + note + body;
}

function render(){
  const canvas=document.getElementById('canvas');
  if(CURRENT==='company'){ canvas.innerHTML=renderCompany(); }
  else {
    const f=DATA.functions.find(x=>x.function===CURRENT);
    canvas.innerHTML = f?renderFunction(f):'<div class="empty">Not found.</div>';
  }
  // wire company cards
  canvas.querySelectorAll('.cofn').forEach(el=>{
    el.addEventListener('click',()=>{ setTab(el.dataset.fn); });
  });
  applySearch();
}

function buildTabs(){
  const tabs=document.getElementById('tabs');
  const items=[{id:'company',label:'Company',n:''}].concat(
    DATA.functions.map(f=>({id:f.function,label:f.function,n:f.count}))
  );
  tabs.innerHTML=items.map(t=>`<div class="tab${t.id===CURRENT?' active':''}" data-id="${esc(t.id)}">${esc(t.label)}${t.n?`<span class="n">${t.n}</span>`:''}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>setTab(el.dataset.id)));
}
function setTab(id){
  CURRENT=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.id===id));
  document.getElementById('canvas').scrollLeft=0;
  render();
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}

function applySearch(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const cards=document.querySelectorAll('.role-card');
  const units=document.querySelectorAll('.unit');
  if(!q){ cards.forEach(c=>c.classList.remove('dim','hit')); units.forEach(u=>u.classList.remove('dim')); return; }
  cards.forEach(c=>{
    const hit=(c.dataset.title||'').includes(q);
    c.classList.toggle('hit',hit); c.classList.toggle('dim',!hit);
  });
  units.forEach(u=>{
    const any=u.querySelector('.role-card.hit'); u.classList.toggle('dim',!any);
  });
}

document.getElementById('q').addEventListener('input',applySearch);
document.getElementById('salT').addEventListener('change',e=>{SHOW_SAL=e.target.checked;render();});
document.getElementById('printBtn').addEventListener('click',()=>window.print());

buildTabs();
render();
</script>
