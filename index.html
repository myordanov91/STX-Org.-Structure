<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organisation Structure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#1D7B7F; --pine-d:#155e69; --pine-l:#e7f2f4;
    --royal:#1360A0; --navy:#031C2B; --mint:#B0F7CF; --coral:#E66D62;
    --ink:#1B2733; --muted:#5A6B7B; --line:#b9cace; --bg:#f4f6f7; --card:#ffffff;
    --grey:#E6E6DC; --pink:#FBEBEC; --chip:#eef3f4;
    --shadow:0 1px 2px rgba(3,28,43,.06),0 6px 18px rgba(3,28,43,.06);
    --radius:10px; --conn:2px;
    /* location accents */
    --loc-bg:#1D7B7F; --loc-ie:#1360A0; --loc-us:#E66D62; --loc-ro:#7a5cc0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Poppins',Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);
       -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.4}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{margin:0;font-weight:600;color:var(--navy)}

  /* Header */
  header.stx-top{display:flex;align-items:center;justify-content:center;gap:16px;
    padding:16px 22px;background:#fff;border-bottom:1px solid var(--line);box-shadow:inset 0 -3px 0 var(--pine);position:sticky;top:0;z-index:40}
  header.stx-top .stx-title h1{font-size:16px}
  header.stx-top .stx-title .sub{font-size:11.5px;color:var(--muted)}
  header.stx-top img.stx-logo{height:32px;width:auto;display:block}

  /* Toolbar */
  .stx-toolbar{position:sticky;top:57px;z-index:35;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .stx-tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .stx-tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 14px;
    font-size:12.5px;font-weight:500;cursor:pointer;transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .stx-tab .n{font-size:10.5px;opacity:.7}
  .stx-tab:hover{border-color:var(--pine);color:var(--pine)}
  .stx-tab.active{background:var(--pine);border-color:var(--pine);color:#fff}
  .stx-tab.dyn{border-style:dashed}
  .stx-tab .x{margin-left:2px;font-size:13px;opacity:.8}
  .stx-tab .x:hover{opacity:1}
  .stx-spacer{flex:1 1 auto}
  .stx-search{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:170px}
  .stx-search input{border:0;outline:0;font-family:inherit;font-size:13px;width:100%;background:transparent;color:var(--ink)}
  .stx-zoom{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .stx-zoom .stx-btn{border:0;border-radius:0;border-right:1px solid var(--line)}
  .stx-zoom .stx-btn:last-child{border-right:0}
  .stx-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-family:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
  .stx-btn:hover{color:var(--pine);border-color:var(--pine)}
  .stx-toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px}
  .stx-toggle input{accent-color:var(--pine);width:15px;height:15px}
  .stx-emp .sal{font-size:10.5px;color:var(--pine-d);font-weight:600;white-space:nowrap}

  /* Location filter */
  .stx-filter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px}
  .stx-filter .flbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
  .loc-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted);transition:.12s;user-select:none;white-space:nowrap}
  .loc-toggle .dot{width:9px;height:9px;border-radius:50%;background:var(--dotc,var(--muted));flex:none}
  .loc-toggle .cnt{font-size:10.5px;opacity:.7}
  .loc-toggle.on{color:#fff;border-color:transparent;background:var(--dotc,var(--pine))}
  .loc-toggle.on .dot{background:#fff}
  .loc-toggle.off{opacity:.55;background:#fff}
  .loc-toggle.off .dot{opacity:.5}

  /* Breadcrumb */
  .stx-crumbs{padding:12px 26px 0;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .stx-crumbs a{color:var(--pine-d);cursor:pointer}
  .stx-crumbs a:hover{text-decoration:underline}
  .stx-crumbs .sep{opacity:.5}
  .stx-crumbs .cur{color:var(--navy);font-weight:600}

  /* Canvas */
  .stx-canvas{padding:22px 26px 60px;overflow-x:auto}

  /* Stats strip */
  .stx-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:0 auto 26px;max-width:820px}
  .stx-stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;position:relative;overflow:hidden}
  .stx-stat .num{font-size:23px;font-weight:700;color:var(--pine-d);line-height:1}
  .stx-stat .lbl{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
  .stx-stat .lbl .dot{width:8px;height:8px;border-radius:50%}
  .stx-stat.off{opacity:.4}

  /* Fan (apex + connected wrapping card grid) */
  .stx-fan{display:flex;flex-direction:column;align-items:center;transform-origin:top center}
  .stx-apex{background:var(--pine);color:#fff;border-radius:var(--radius);padding:12px 22px;min-width:230px;max-width:420px;text-align:center;box-shadow:var(--shadow)}
  .stx-apex .role{font-weight:600;font-size:15px;line-height:1.25}
  .stx-apex .meta{font-size:11.5px;opacity:.92;margin-top:3px}
  .stx-apex .ctx{font-size:11px;opacity:.85;margin-top:2px}
  .fan-drop{width:var(--conn);height:22px;background:var(--line)}
  .stx-fan-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;
    border-top:var(--conn) solid var(--line);padding-top:24px;position:relative;max-width:100%}
  .stx-fan-grid.single{border-top:0;padding-top:0}
  .stx-fan-grid>.item{position:relative}
  .stx-fan-grid:not(.single)>.item::before{content:'';position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:var(--conn);height:24px;background:var(--line)}

  /* Nav cards */
  .stx-navcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--pine);border-radius:var(--radius);
    padding:13px 15px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;text-align:left;width:186px;min-height:104px;
    display:flex;flex-direction:column}
  .stx-navcard:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(3,28,43,.14);border-color:var(--pine)}
  .stx-navcard .ttl{font-weight:600;font-size:13.5px;color:var(--pine-d);line-height:1.25}
  .stx-navcard .ctx{font-size:10.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.3px}
  .stx-navcard .cnt{font-size:12px;color:var(--ink);margin-top:8px}
  .stx-navcard .open{color:var(--pine);font-weight:600;font-size:12px;margin-top:auto;padding-top:8px}
  .stx-navcard .cf-link{display:inline-flex;align-items:center;gap:3px;align-self:flex-start;margin-top:6px;color:var(--pine);font-weight:600;font-size:11px;border-bottom:1.5px solid var(--pine)}
  .stx-navcard .cf-link:hover{color:var(--pine-d)}
  .stx-apex a.cf-apex{color:#fff;border-bottom:1px solid rgba(255,255,255,.6);display:inline-flex;align-items:center;gap:3px}
  .unit-head{font-weight:700;color:var(--ink);font-size:15px;text-align:center;margin:0 0 4px}
  .unit-head .cf-inline{font-size:12px;font-weight:600;color:var(--pine);border-bottom:1.5px solid var(--pine)}
  .stx-apex .ap-wrap{display:flex;gap:11px;align-items:center;justify-content:center;text-align:left}
  .stx-apex .av{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
  .stx-apex .jd-w{color:#fff;border-bottom:1px solid rgba(255,255,255,.55);display:inline-flex;align-items:center;gap:3px}
  .stx-apex .dr{font-weight:700;opacity:.95}
  .stx-person{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:184px;max-width:216px;text-align:left;box-shadow:0 1px 2px rgba(16,40,34,.05);position:relative}
  .stx-person .top{display:flex;gap:10px;align-items:flex-start}
  .stx-person .av{width:34px;height:34px;border-radius:50%;flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12.5px}
  .stx-person .pi{min-width:0}
  .stx-person .nm{font-weight:700;font-size:13px;color:var(--ink);line-height:1.2}
  .stx-person .rl{font-size:12px;color:var(--ink);opacity:.85;margin-top:1px;display:block;text-decoration:none}
  .stx-person a.rl{color:var(--pine);opacity:1;border-bottom:1px solid rgba(15,95,79,.35);display:inline-flex;align-items:center;gap:3px}
  .stx-person .dp{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:7px;font-weight:700}
  .stx-person .lo{font-size:11px;color:var(--muted);margin-top:2px}
  .stx-person .co{display:inline-block;margin-top:7px;font-size:9px;font-weight:700;letter-spacing:.03em;color:#8a5a00;background:#fdf1dc;border:1px solid #f2d9a8;border-radius:5px;padding:1px 6px}
  .stx-person .av .exti,.stx-person .exti{position:absolute;right:10px;bottom:9px;color:var(--line2,#c9d6d0)}

  /* Role unit boxes (team view) */
  .stx-unit{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);text-align:left;width:252px}
  .stx-unit-h{background:var(--pine-l);border-bottom:1px solid var(--line);padding:9px 12px;color:var(--pine-d)}
  .stx-unit-h .rt{font-weight:600;font-size:12.5px;line-height:1.25;display:flex;align-items:flex-start;gap:6px;justify-content:space-between}
  .stx-unit-h a.rt-link{color:var(--pine-d);border-bottom:1.5px solid var(--pine)}
  .stx-unit-h .rt-meta{margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .stx-emp{padding:7px 12px;border-top:1px solid #eef1f2;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .stx-emp:first-child{border-top:0}
  .stx-emp .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
  .stx-emp .er{display:inline-flex;align-items:center;gap:6px;flex:none}
  .stx-emp .co{font-size:9.5px;color:var(--coral);border:1px solid var(--coral);border-radius:5px;padding:0 5px;font-weight:600;white-space:nowrap}

  /* Chips */
  .stx-chip{background:var(--chip);color:var(--muted);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .loc-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .loc-chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .stx-ext{display:inline-block;width:11px;height:11px;margin-left:2px;vertical-align:-1px;opacity:.7;flex:none}

  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px;max-width:420px}

  footer.stx-foot{padding:14px 26px 40px;color:var(--muted);font-size:11px;text-align:center}

  .dim{opacity:.22}
  .hit{outline:2px solid var(--coral);outline-offset:-2px;border-radius:8px}

  @media (max-width:520px){
    .stx-navcard{width:150px}
    .stx-unit{width:100%;max-width:320px}
  }

  /* ---- people org tree ---- */
  .ptree{padding:6px 0 12px;display:flex;justify-content:center;min-width:100%}
  .ptree ul{position:relative;padding-top:20px;display:flex;justify-content:center}
  .ptree li{list-style:none;position:relative;padding:20px 8px 0;display:flex;flex-direction:column;align-items:center}
  .ptree li::before,.ptree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:20px;border-top:2px solid var(--line)}
  .ptree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
  .ptree li:only-child::before,.ptree li:only-child::after{display:none}
  .ptree li:first-child::before,.ptree li:last-child::after{border:0 none}
  .ptree li:last-child::before{border-right:2px solid var(--line)}
  .ptree ul ul::before{content:"";position:absolute;top:0;left:50%;width:0;height:20px;border-left:2px solid var(--line)}
  .ptree>ul{padding-top:0}
  .ptree>ul>li{padding-top:0}
  .ptree>ul>li::before,.ptree>ul>li::after{display:none}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px;min-width:158px;max-width:205px;text-align:left;box-shadow:0 1px 2px rgba(16,40,34,.05)}
  .pcard.mgr,.pcard.pbox{background:var(--pine);border-color:var(--pine);color:#fff}
  .pcard.pbox{text-align:center;padding:12px 16px}
  .pcard .nm{font-weight:700;font-size:12.5px;line-height:1.2}
  .pcard .rl{font-size:11.5px;color:var(--ink);opacity:.82;margin-top:1px}
  .pcard .lo{font-size:10.5px;color:var(--muted);margin-top:3px}
  .pcard.mgr .rl,.pcard.pbox .rl{color:#fff;opacity:.92}
  .pcard.mgr .lo,.pcard.pbox .lo{color:#fff;opacity:.82}
</style>
</head>

const esc=s=>(s==null?'':String(s)).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));

const ACTIVE=new Set(DATA.locations);
let VIEW={type:'company'};
const inLoc=e=>ACTIVE.has(e.loc);
const unitVis=u=>(u.people||[]).filter(inLoc).length;
const deptVis=d=>d.units.reduce((n,u)=>n+unitVis(u),0);
const teamUnits=d=>d.units.map((u,ui)=>({u,ui})).filter(o=>o.u.name!==d.headUnit);
const funcVis=f=>f.departments.reduce((n,d)=>n+deptVis(d),0)+((f.head&&f.headFloating&&ACTIVE.has(f.head.loc))?1:0);
const totalVis=()=>DATA.functions.reduce((n,f)=>n+funcVis(f),0);
const locCount=loc=>{let n=0;DATA.functions.forEach(f=>{f.departments.forEach(d=>d.units.forEach(u=>(u.people||[]).forEach(e=>{if(e.loc===loc)n++;})));if(f.head&&f.headFloating&&f.head.loc===loc)n++;});return n;};
const findFn=name=>DATA.functions.find(f=>f.name===name);
const ppl=n=>n+' '+(n===1?'person':'people');
const LORD={EX1:100,D6:95,D5:94,D4:93,M4:84,M3:83,M2:82,M1:81,IC5:75,IC4:74,IC3:73,IC2:72,IC1:71};
const lvlRank=l=>LORD[(l||'').toUpperCase()]||0;

function renderFilter(){const wrap=document.getElementById('filter');wrap.querySelectorAll('.loc-toggle').forEach(n=>n.remove());
  DATA.locations.forEach(loc=>{const on=ACTIVE.has(loc);const b=document.createElement('button');b.className='loc-toggle '+(on?'on':'off');
    b.innerHTML=esc(loc)+' <span class="cnt">'+locCount(loc)+'</span>';
    b.onclick=()=>{if(ACTIVE.has(loc))ACTIVE.delete(loc);else ACTIVE.add(loc);if(ACTIVE.size===0)ACTIVE.add(loc);render();};wrap.appendChild(b);});}

function renderTabs(){const t=document.getElementById('tabs');t.innerHTML='';
  const mk=(label,active,onclick,extra)=>{const b=document.createElement('button');b.className='stx-tab'+(active?' active':'')+(extra||'');b.innerHTML=label;b.onclick=onclick;t.appendChild(b);return b;};
  mk('Company',VIEW.type==='company',()=>{VIEW={type:'company'};render();});
  DATA.functions.forEach(f=>{if(funcVis(f)===0)return;mk(esc(f.name)+' <span class="n">'+funcVis(f)+'</span>',VIEW.fn===f.name,()=>{VIEW={type:'function',fn:f.name};render();});});
  if(VIEW.type==='department'||VIEW.type==='unit'){const f=findFn(VIEW.fn),d=f&&f.departments[VIEW.di];
    if(d)mk(esc(d.name)+' <span class="x" title="Close">\u2715</span>',VIEW.type==='department',(ev)=>{VIEW=ev.target.classList.contains('x')?{type:'function',fn:VIEW.fn}:{type:'department',fn:VIEW.fn,di:VIEW.di};render();},' dyn');}
  if(VIEW.type==='unit'){const f=findFn(VIEW.fn),d=f&&f.departments[VIEW.di],u=d&&d.units[VIEW.ui];
    if(u)mk(esc(u.name)+' <span class="x" title="Close">\u2715</span>',true,(ev)=>{if(ev.target.classList.contains('x')){VIEW={type:'department',fn:VIEW.fn,di:VIEW.di};render();}},' dyn');}}

function renderCrumbs(){const c=document.getElementById('crumbs');c.innerHTML='';
  const link=(l,fn)=>{const a=document.createElement('a');a.textContent=l;a.onclick=fn;c.appendChild(a);};
  const cur=l=>{const s=document.createElement('span');s.className='cur';s.textContent=l;c.appendChild(s);};
  const sep=()=>{const s=document.createElement('span');s.className='sep';s.textContent='\u203a';c.appendChild(s);};
  if(VIEW.type==='company'){cur('Company');return;}
  link('Company',()=>{VIEW={type:'company'};render();});const f=findFn(VIEW.fn),d=f&&f.departments[VIEW.di],u=d&&d.units[VIEW.ui];
  sep();(VIEW.type==='function')?cur(VIEW.fn):link(VIEW.fn,()=>{VIEW={type:'function',fn:VIEW.fn};render();});
  if(d){sep();(VIEW.type==='department')?cur(d.name):link(d.name,()=>{VIEW={type:'department',fn:VIEW.fn,di:VIEW.di};render();});}
  if(u){sep();cur(u.name);}}

function fan(apexHTML,items){const single=items.length<=1;
  return '<div class="stx-fan"><div class="stx-apex">'+apexHTML+'</div>'+
   (items.length?'<div class="fan-drop"></div><div class="stx-fan-grid'+(single?' single':'')+'">'+items.map(h=>'<div class="item">'+h+'</div>').join('')+'</div>':'')+'</div>';}
function navcard(title,ctx,cnt,onclick,search){
  return '<div class="stx-navcard" data-search="'+esc(search)+'" onclick="'+onclick+'">'+
    '<div class="ttl">'+esc(title)+'</div>'+(ctx?'<div class="ctx">'+esc(ctx)+'</div>':'')+
    '<div class="cnt">'+cnt+'</div><div class="open">Open \u2197</div></div>';}
function apexPerson(p){const loc=p.locDetail||p.loc||'';return '<div class="role">'+esc(p.name)+'</div><div class="meta">'+esc(p.role||p.title||'')+'</div>'+(loc?'<div class="ctx">'+esc(loc)+'</div>':'');}

/* ---- people tree ---- */
function pcard(p,cls){return '<div class="pcard'+(cls?' '+cls:'')+'" data-search="'+esc((p.name+' '+p.role+' '+(p.locDetail||p.loc||'')).toLowerCase())+'">'+
  '<div class="nm">'+esc(p.name)+'</div><div class="rl">'+esc(p.role)+'</div><div class="lo">'+esc(p.locDetail||p.loc||'')+'</div></div>';}
function pbox(name,n){return '<div class="pcard pbox"><div class="nm">'+esc(name)+'</div><div class="lo">'+ppl(n)+'</div></div>';}
function treeNode(p,people,seen){
  if(seen.has(p.name))return ''; seen.add(p.name);
  let kids=people.filter(q=>q.manager===p.name&&q.name!==p.name);
  kids.sort((a,b)=>lvlRank(b.level)-lvlRank(a.level)||a.name.localeCompare(b.name));
  return '<li>'+pcard(p,kids.length?'mgr':'')+(kids.length?'<ul>'+kids.map(k=>treeNode(k,people,seen)).join('')+'</ul>':'')+'</li>';}

function viewCompany(){
  const stats=['<div class="stx-stat"><div class="num">'+totalVis()+'</div><div class="lbl">Total employees</div></div>']
    .concat(DATA.locations.map(loc=>{const on=ACTIVE.has(loc);return '<div class="stx-stat'+(on?'':' off')+'"><div class="num">'+locCount(loc)+'</div><div class="lbl">'+esc(loc)+'</div></div>';})).join('');
  const cards=DATA.functions.filter(f=>funcVis(f)>0).map(f=>{const nD=f.departments.filter(d=>deptVis(d)>0).length;
    return navcard(f.name,'','<b>'+funcVis(f)+'</b> people \u00b7 '+nD+' dept'+(nD===1?'':'s'),"go('"+f.name.replace(/'/g,"\\'")+"')",f.name.toLowerCase());});
  const apex='<div class="role">'+esc(DATA.ceo.name)+'</div><div class="meta">'+esc(DATA.ceo.title)+'</div>';
  return '<div class="stx-stats">'+stats+'</div>'+fan(apex,cards);}

function viewFunction(f){
  const cards=f.departments.map((d,di)=>({d,di})).filter(o=>deptVis(o.d)>0).map(({d,di})=>{const nU=teamUnits(d).filter(o=>unitVis(o.u)>0).length;
    return navcard(d.name,'','<b>'+deptVis(d)+'</b> people \u00b7 '+nU+' unit'+(nU===1?'':'s'),"goDept('"+f.name.replace(/'/g,"\\'")+"',"+di+")",(d.name+' '+f.name).toLowerCase());});
  const apex=f.head?apexPerson({name:f.head.name,role:f.head.title,locDetail:f.head.locDetail,loc:f.head.loc}):'<div class="role">'+esc(f.name)+'</div><div class="meta">'+ppl(funcVis(f))+'</div>';
  return fan(apex,cards);}

function viewDepartment(f,d,di){
  const cards=teamUnits(d).filter(o=>unitVis(o.u)>0).map(({u,ui})=>
    navcard(u.name,'','<b>'+unitVis(u)+'</b> people',"goUnit('"+f.name.replace(/'/g,"\\'")+"',"+di+","+ui+")",(u.name+' '+d.name).toLowerCase()));
  const apex=d.head?apexPerson({name:d.head.name,role:d.head.title,locDetail:d.head.locDetail,loc:d.head.loc}):'<div class="role">'+esc(d.name)+'</div><div class="ctx">'+esc(f.name)+'</div><div class="meta">'+ppl(deptVis(d))+'</div>';
  return fan(apex,cards);}

function viewUnit(f,d,u){
  const people=(u.people||[]).filter(inLoc);
  if(!people.length) return '<div class="empty" style="margin:20px auto 0">No employees at the selected locations. Adjust the location filter.</div>';
  const names=new Set(people.map(p=>p.name));
  let roots=people.filter(p=>!names.has(p.manager));
  roots.sort((a,b)=>lvlRank(b.level)-lvlRank(a.level)||a.name.localeCompare(b.name));
  const hasReports=r=>people.some(q=>q.manager===r.name&&q.name!==r.name);
  if(roots.length===1&&hasReports(roots[0])){
    return '<div class="ptree"><ul>'+treeNode(roots[0],people,new Set())+'</ul></div>';}
  const seen=new Set();
  const kids=roots.map(r=>treeNode(r,people,seen)).join('');
  return '<div class="ptree"><ul><li>'+pbox(u.name,people.length)+'<ul>'+kids+'</ul></li></ul></div>';}

window.go=name=>{VIEW={type:'function',fn:name};render();};
window.goDept=(name,di)=>{VIEW={type:'department',fn:name,di};render();};
window.goUnit=(name,di,ui)=>{VIEW={type:'unit',fn:name,di,ui};render();};

let ZOOM=1;
const canvasEl=()=>document.querySelector('.stx-fan, .ptree');
function applyZoom(){const el=canvasEl();if(el)el.style.zoom=ZOOM;}
function autoFit(){const c=document.getElementById('canvas'),el=canvasEl();if(!el)return;el.style.zoom=1;const nw=el.scrollWidth,av=c.clientWidth-4;ZOOM=nw>av?Math.max(0.35,av/nw):1;el.style.zoom=ZOOM;}
document.getElementById('zIn').onclick=()=>{ZOOM=Math.min(1.4,ZOOM+0.1);applyZoom();};
document.getElementById('zOut').onclick=()=>{ZOOM=Math.max(0.3,ZOOM-0.1);applyZoom();};
document.getElementById('zFit').onclick=autoFit;
window.addEventListener('resize',()=>{clearTimeout(window._z);window._z=setTimeout(autoFit,150);});

function applySearch(){const q=(document.getElementById('q').value||'').trim().toLowerCase();
  document.querySelectorAll('[data-search]').forEach(el=>{const hit=!q||(el.dataset.search||'').includes(q);el.classList.toggle('hit',!!q&&hit);el.classList.toggle('dim',!!q&&!hit);});}
document.getElementById('q').addEventListener('input',applySearch);

function render(){renderFilter();renderTabs();renderCrumbs();const canvas=document.getElementById('canvas');let html='';
  if(VIEW.type==='company')html=viewCompany();
  else{const f=findFn(VIEW.fn);if(!f)html=viewCompany();
    else if(VIEW.type==='function')html=viewFunction(f);
    else{const d=f.departments[VIEW.di];if(!d)html=viewFunction(f);
      else if(VIEW.type==='department')html=viewDepartment(f,d,VIEW.di);
      else{const u=d.units[VIEW.ui];html=u?viewUnit(f,d,u):viewDepartment(f,d,VIEW.di);}}}
  canvas.innerHTML=html;autoFit();applySearch();}
render();

</script>
