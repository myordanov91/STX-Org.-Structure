<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organisation structure</title>
<style>
  :root{
    --canvas:#f5f7fa;
    --card:#ffffff;
    --ink:#1b2733;
    --ink-soft:#5a6b7b;
    --ink-faint:#8b99a8;
    --line:#c7d0da;
    --line-soft:#e3e9ef;
    --focus:#2563a8;
    --focus-soft:#e8f0f9;
    --bar-default:#7a8794;
    --shadow:0 1px 2px rgba(27,39,51,.06);
    --shadow-lift:0 6px 18px rgba(27,39,51,.14);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:var(--canvas);
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- top bar ---------- */
  header{
    background:var(--card);
    border-bottom:1px solid var(--line-soft);
    padding:14px 22px;
    display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;
    position:sticky;top:0;z-index:20;
  }
  .title-block h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .title-block p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .spacer{flex:1 1 auto;}

  .search{
    position:relative;
  }
  .search input{
    font:inherit;font-size:13.5px;
    padding:8px 12px 8px 32px;width:230px;max-width:46vw;
    border:1px solid var(--line);border-radius:8px;background:var(--canvas);color:var(--ink);
  }
  .search input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus);background:var(--card);}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}

  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .btn{
    font:inherit;font-size:13px;
    padding:7px 11px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--ink);cursor:pointer;line-height:1;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  .zoom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .zoom button{font:inherit;border:0;background:var(--card);cursor:pointer;padding:7px 11px;color:var(--ink);}
  .zoom button:hover{background:var(--canvas);}
  .zoom span{padding:0 8px;font-size:12.5px;color:var(--ink-soft);min-width:44px;text-align:center;}

  .switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;user-select:none;}
  .switch input{position:absolute;opacity:0;}
  .track{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:0 0 auto;}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--shadow);transition:transform .15s;}
  .switch input:checked + .track{background:var(--focus);}
  .switch input:checked + .track::after{transform:translateX(16px);}
  .switch input:focus-visible + .track{outline:2px solid var(--focus);outline-offset:2px;}

  /* ---------- legend ---------- */
  .legend{
    display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;
    padding:9px 22px;background:var(--card);border-bottom:1px solid var(--line-soft);
    font-size:12.5px;color:var(--ink-soft);
  }
  .legend .lg{display:inline-flex;align-items:center;gap:7px;}
  .legend .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}

  /* ---------- canvas ---------- */
  .canvas{flex:1 1 auto;overflow:auto;padding:40px 40px 80px;}
  .scaler{transform-origin:top center;transform:scale(var(--scale,1));width:max-content;margin:0 auto;transition:transform .12s ease;}

  /* ---------- tree ---------- */
  .tree,.tree ul{display:flex;justify-content:center;padding:0;margin:0;list-style:none;}
  .tree ul{position:relative;padding-top:26px;}
  .tree li{position:relative;padding:26px 10px 0;text-align:center;}
  .tree li::before,.tree li::after{
    content:"";position:absolute;top:0;right:50%;
    border-top:2px solid var(--line);width:50%;height:26px;
  }
  .tree li::after{right:auto;left:50%;border-left:2px solid var(--line);}
  .tree li::before{border-right:2px solid var(--line);}
  .tree li:only-child::before,.tree li:only-child::after{display:none;}
  .tree li:only-child{padding-top:26px;}
  .tree li:first-child::before,.tree li:last-child::after{border:0 none;}
  .tree li:last-child::before{border-right:2px solid var(--line);}
  .tree ul::before{
    content:"";position:absolute;top:0;left:50%;
    border-left:2px solid var(--line);width:0;height:26px;
  }
  /* roots: no connectors above */
  .tree.root{padding-top:0;}
  .tree.root::before{display:none;}
  .tree.root > li{padding-top:0;}
  .tree.root > li::before,.tree.root > li::after{display:none;}
  /* collapsed */
  li.collapsed > ul{display:none;}

  /* ---------- node card ---------- */
  .node{
    position:relative;display:inline-flex;text-align:left;
    background:var(--card);border:1px solid var(--line-soft);
    border-radius:var(--radius);box-shadow:var(--shadow);
    min-width:184px;max-width:212px;overflow:hidden;
    transition:box-shadow .13s ease, transform .13s ease, border-color .13s;
  }
  .node:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px);border-color:var(--line);}
  .bar{width:5px;flex:0 0 auto;background:var(--bar,var(--bar-default));}
  .body{padding:11px 13px 12px;flex:1 1 auto;min-width:0;}
  .node-title{
    display:block;font-size:14px;font-weight:600;line-height:1.25;color:var(--ink);
    text-decoration:none;letter-spacing:-.005em;word-break:break-word;
  }
  a.node-title:hover{color:var(--focus);text-decoration:underline;}
  a.node-title:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px;}
  .node-meta{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap;}
  .node-unit{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}
  .tag{
    font-size:11px;color:var(--ink-soft);background:var(--canvas);
    border:1px solid var(--line-soft);border-radius:5px;padding:1px 6px;line-height:1.5;
  }
  .team-tag{color:var(--bar,var(--bar-default));border-color:transparent;background:transparent;padding:1px 0;font-weight:600;}
  .node-salary{
    margin-top:8px;font-size:13px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums;letter-spacing:.005em;
  }
  .node-salary .lbl{font-size:10.5px;font-weight:500;color:var(--ink-faint);display:block;margin-bottom:1px;}
  .node-salary.empty{color:var(--ink-faint);font-weight:500;font-size:12px;}
  .no-salary .node-salary{display:none;}
  .node-fw{
    margin-top:9px;font-size:12px;color:var(--focus);text-decoration:none;
    display:inline-flex;align-items:center;gap:4px;
  }
  .node-fw:hover{text-decoration:underline;}
  .node-fw:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px;}
  .node-fw.disabled{color:var(--ink-faint);pointer-events:none;}
  .node-notes{margin-top:7px;font-size:11.5px;color:var(--ink-faint);line-height:1.35;}

  /* collapse toggle */
  .toggle{
    position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);
    z-index:3;font:inherit;font-size:11px;font-weight:600;
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    border-radius:999px;height:22px;min-width:22px;padding:0 7px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:3px;
    box-shadow:var(--shadow);line-height:1;
  }
  .toggle:hover{color:var(--ink);border-color:var(--ink-faint);}
  .toggle:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  li:not(.collapsed) > .node-wrap .toggle .count{display:none;}

  .node-wrap{position:relative;display:inline-block;}

  /* search dimming + match */
  .dim .node{opacity:.32;filter:grayscale(.3);}
  .match .node{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus-soft),var(--shadow);}

  .status{font-size:12.5px;color:var(--ink-soft);padding:0 22px 10px;}
  .status.warn{color:#9a5b00;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<header>
  <div class="title-block">
    <h1>Organisation structure</h1>

  </div>
  <div class="spacer"></div>
  <div class="search">

</header>

<div class="legend" id="legend"></div>
<div class="status" id="status" hidden></div>

<div class="canvas">
  <div class="scaler" id="scaler">
    <ul class="tree root" id="tree"></ul>
  </div>
</div>

/* named colours for known teams; anything else auto-assigns from PALETTE */
const TEAM_COLORS = {
  "Executive":"#3b3b6d",
  "Operations":"#1e7f8e",
  "TECH":"#6d5bb5",
  "Commercial":"#b9770e",
  "Marketing":"#8e3b5c",
  "Finance":"#4a7c3f",
  "HR":"#0f6e8c",
};
const PALETTE = ["#2f6f6f","#7a5aa0","#a1662f","#3f6b9c","#8a5a3c","#5a7a3c","#9c3f6b","#3c6b8a"];
const teamColorCache = {};
let paletteIdx = 0;
function teamColor(team){
  if(!team) return "var(--bar-default)";
  if(TEAM_COLORS[team]) return TEAM_COLORS[team];
  if(!teamColorCache[team]){ teamColorCache[team] = PALETTE[paletteIdx % PALETTE.length]; paletteIdx++; }
  return teamColorCache[team];
}

/* ---------- helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => (n===""||n==null||isNaN(n)) ? null : Number(n);
const fmtMoney = n => CONFIG.currency + Number(n).toLocaleString("en-US");
function salaryText(r){
  const a=num(r.salaryMin), b=num(r.salaryMax);
  if(a==null && b==null) return {empty:true, text:"Band to be set"};
  if(a!=null && b!=null) return {empty:false, text:`${fmtMoney(a)}\u2013${fmtMoney(b)}`};
  return {empty:false, text: fmtMoney(a!=null?a:b)};
}
const isRealLink = u => u && /^https?:\/\//i.test(u);

/* ---------- build tree model ---------- */
function buildForest(rows){
  const byId={}; rows.forEach(r=>byId[r.id]=Object.assign({children:[]},r));
  const roots=[];
  rows.forEach(r=>{
    const parent = r.reportsTo && byId[r.reportsTo];
    if(parent && parent.id!==r.id) parent.children.push(byId[r.id]);
    else roots.push(byId[r.id]);
  });
  return roots;
}

/* ---------- render ---------- */
function nodeHTML(n){
  const color = teamColor(n.team);
  const sal = salaryText(n);
  const titleInner = isRealLink(n.jd)
    ? `<a class="node-title" href="${esc(n.jd)}" target="_blank" rel="noopener" title="Open job description">${esc(n.title)}</a>`
    : `<span class="node-title" title="No job description linked">${esc(n.title)}</span>`;
  const fw = isRealLink(n.framework)
    ? `<a class="node-fw" href="${esc(n.framework)}" target="_blank" rel="noopener">Career framework
         <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg></a>`
    : `<span class="node-fw disabled">No framework linked</span>`;
  const meta = [];
  if(n.team)  meta.push(`<span class="team-tag" style="color:${color}">${esc(n.team)}</span>`);
  if(n.level) meta.push(`<span class="tag">${esc(n.level)}</span>`);
  if(n.dept && n.dept!==n.team) meta.push(`<span class="tag">${esc(n.dept)}</span>`);
  const salClass = sal.empty ? "node-salary empty" : "node-salary";
  const salInner = sal.empty ? esc(sal.text) : `<span class="lbl">Salary band</span>${esc(sal.text)}`;
  const salaryBlock = SHOW_SALARY ? `<div class="${salClass}">${salInner}</div>` : "";
  const notes = n.notes ? `<div class="node-notes">${esc(n.notes)}</div>` : "";
  return `<div class="node" style="--bar:${color}" data-search="${esc((n.title+' '+n.team+' '+(n.dept||'')+' '+(n.unit||'')+' '+n.level+' '+(n.company||'')+' '+(n.notes||'')).toLowerCase())}">
      <span class="bar"></span>
      <div class="body">
        ${titleInner}
        ${n.unit ? `<div class="node-unit">${esc(n.unit)}</div>` : ""}
        <div class="node-meta">${meta.join("")}</div>
        ${salaryBlock}
        ${fw}
        ${notes}
      </div>
    </div>`;
}
function liHTML(n){
  const kids = n.children.length;
  const toggle = kids ? `<button class="toggle" aria-expanded="true" aria-label="Collapse ${esc(n.title)}"><span class="sign">&minus;</span><span class="count">${kids}</span></button>` : "";
  const childUl = kids ? `<ul>${n.children.map(liHTML).join("")}</ul>` : "";
  return `<li class="${kids?'has-children':''}">
      <div class="node-wrap">${nodeHTML(n)}${toggle}</div>
      ${childUl}
    </li>`;
}
function render(){
  const roots = buildForest(DATA);
  document.getElementById("tree").innerHTML = roots.map(liHTML).join("");
  buildLegend();
  wireToggles();
  applyZoom();
}

/* ---------- legend ---------- */
function buildLegend(){
  const teams=[]; DATA.forEach(r=>{ if(r.team && !teams.includes(r.team)) teams.push(r.team); });
  document.getElementById("legend").innerHTML = teams.map(t=>
    `<span class="lg"><span class="dot" style="background:${teamColor(t)}"></span>${esc(t)}</span>`).join("");
}

/* ---------- collapse / expand ---------- */
function wireToggles(){
  document.querySelectorAll(".toggle").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const li = btn.closest("li");
      const collapsed = li.classList.toggle("collapsed");
      btn.setAttribute("aria-expanded", String(!collapsed));
      btn.querySelector(".sign").innerHTML = collapsed ? "+" : "&minus;";
    });
  });
}
function setAll(collapsed){
  document.querySelectorAll("li.has-children").forEach(li=>{
    // never collapse the very top so the chart never vanishes
    const isRoot = li.parentElement.classList.contains("root");
    if(isRoot && collapsed) return;
    li.classList.toggle("collapsed", collapsed);
    const btn=li.querySelector(":scope > .node-wrap > .toggle");
    if(btn){ btn.setAttribute("aria-expanded", String(!collapsed)); btn.querySelector(".sign").innerHTML = collapsed?"+":"&minus;"; }
  });
}
document.getElementById("expandAll").onclick = ()=>setAll(false);
document.getElementById("collapseAll").onclick = ()=>setAll(true);

/* ---------- zoom ---------- */
let scale=1;
function applyZoom(){
  document.getElementById("scaler").style.setProperty("--scale", scale);
  document.getElementById("zoomLabel").textContent = Math.round(scale*100)+"%";
}
document.getElementById("zoomIn").onclick  = ()=>{ scale=Math.min(1.6, +(scale+0.1).toFixed(2)); applyZoom(); };
document.getElementById("zoomOut").onclick = ()=>{ scale=Math.max(0.4, +(scale-0.1).toFixed(2)); applyZoom(); };

/* ---------- hide salaries ---------- */
// salary view disabled in all-staff build

/* ---------- search ---------- */
const searchEl = document.getElementById("search");
searchEl.addEventListener("input", ()=>{
  const q = searchEl.value.trim().toLowerCase();
  const items = document.querySelectorAll("#tree li");
  if(!q){ items.forEach(li=>li.classList.remove("dim","match")); return; }
  setAll(false); // reveal everything so matches aren't hidden inside collapsed branches
  items.forEach(li=>{
    const node = li.querySelector(":scope > .node-wrap > .node");
    const hit = node && node.dataset.search.includes(q);
    li.classList.toggle("match", !!hit);
    li.classList.toggle("dim", !hit);
  });
  // undim ancestors of any match so the path stays readable
  document.querySelectorAll("#tree li.match").forEach(li=>{
    let p=li.parentElement.closest("li");
    while(p){ p.classList.remove("dim"); p=p.parentElement.closest("li"); }
  });
});

/* ---------- load .xlsx ---------- */
const status = document.getElementById("status");
function showStatus(msg, warn){ status.hidden=false; status.textContent=msg; status.classList.toggle("warn", !!warn); }
const HEADERS = {
  id:"Role ID", title:"Job Title", team:"Function", dept:"Department", unit:"Unit", level:"Level",
  reportsTo:"Reports To (Role ID)", salaryMin:"Salary Min", salaryMax:"Salary Max",
  jd:"JD Link", framework:"Career Framework Link", company:"Company", notes:"Notes"
};
var _lb=document.getElementById("loadBtn"); if(_lb) _lb.onclick = ()=>{
  if(typeof XLSX === "undefined"){
    showStatus("Loading data from a file needs an internet connection. The chart above works offline with its built-in data — reconnect to import, or ask for a refreshed file.", true);
    return;
  }
  document.getElementById("fileInput").click();
};
var _fi=document.getElementById("fileInput"); if(_fi) _fi.addEventListener("change", e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:"array"});
      const ws = wb.Sheets["Roles"];
      if(!ws){ showStatus('No "Roles" sheet found in that workbook. Use the source-of-truth file.', true); return; }
      const rows = XLSX.utils.sheet_to_json(ws, {range:2, defval:""}); // headers on row 3
      const mapped = rows
        .map(r=>({
          id:String(r[HEADERS.id]).trim(), title:String(r[HEADERS.title]).trim(),
          team:String(r[HEADERS.team]).trim(), dept:String(r[HEADERS.dept]||"").trim(),
          unit:String(r[HEADERS.unit]||"").trim(), level:String(r[HEADERS.level]).trim(),
          reportsTo:String(r[HEADERS.reportsTo]).trim(),
          salaryMin:r[HEADERS.salaryMin], salaryMax:r[HEADERS.salaryMax],
          jd:String(r[HEADERS.jd]||"").trim(), framework:String(r[HEADERS.framework]||"").trim(),
          company:String(r[HEADERS.company]||"").trim(),
          notes:String(r[HEADERS.notes]||"").trim()
        }))
        .filter(r=>r.id && r.title);
      if(!mapped.length){ showStatus("No roles found — check that Role ID and Job Title are filled in.", true); return; }
      DATA = mapped; render();
      showStatus(`Loaded ${mapped.length} roles from ${file.name}.`, false);
    }catch(err){
      showStatus("Couldn't read that file. Make sure it's the .xlsx source-of-truth workbook.", true);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value="";
});

render();
</script>
